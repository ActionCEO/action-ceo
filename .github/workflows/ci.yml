name: PR check
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - uses: actions/cache@v4
        with: { path: .cache, key: "og-${{ hashFiles('src/content/**', 'src/site.ts') }}", restore-keys: og- }
      - name: Publish guard
        run: node scripts/publish-guard.mjs
        env: { GH_TOKEN: "${{ github.token }}" }
      - name: Content gate, build, SEO checks
        run: npm run build
        env: { STRICT_HOST: "1" }
      - name: Schema tests
        run: node scripts/test-sql.mjs
