name: Keep schedules alive
# GitHub turns scheduled workflows off after 60 days without repo activity. This re-enables them. No keep-alive commits.
on:
  schedule:
    - cron: "23 6 1 * *"
  workflow_dispatch:
permissions:
  actions: write
jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for wf in pipeline.yml daily.yml keepalive.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable" || true
          done
        env: { GH_TOKEN: "${{ github.token }}" }
